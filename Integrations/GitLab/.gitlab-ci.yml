stages: [test, analyze, verify, release]

variables:
  CARTOGRAPH_CI_RUNNER_TAG: cartograph-ci-macos

include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/cartograph@$CI_COMMIT_SHA
    inputs:
      job-name: cartograph-corpus
      stage: analyze
      runner-tags: ["$CARTOGRAPH_CI_RUNNER_TAG"]
      project: fixtures/Smoke
      command: dead
      fail-on-findings: false

component-tests:
  stage: test
  # python:3.12-slim, resolved 2026-10-18. Update it as README.md describes.
  image: python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
  script:
    - python3 -m unittest discover -s tests -v

verify-corpus-report:
  stage: verify
  # python:3.12-slim, resolved 2026-10-18. Update it as README.md describes.
  image: python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
  needs:
    - job: cartograph-corpus
      artifacts: true
  script:
    - python3 tests/verify_pipeline.py

publish-catalog:
  stage: release
  # gitlab-org/cli:latest, resolved 2026-10-18. Update it as README.md describes.
  image: registry.gitlab.com/gitlab-org/cli@sha256:825b089e4a02ea31c52b71fd483427518bf673d114fa5f402b070ca6993459d6
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "Publishing the verified Cartograph CI component."
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Cartograph CI $CI_COMMIT_TAG"
    description: >-
      Cartograph Swift analysis for macOS runners, with GitLab Code Quality reports.
      See README.md for inputs and analysis limitations.
