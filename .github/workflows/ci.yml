name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Package.swift 는 툴체인(Swift 6.4)에 대응하는 indexstore-db 릴리스 브랜치를 고정한다.
# 러너 기본 Xcode 가 그보다 낮으면 빌드가 실패하므로, 이미지에 있는 가장 새로운
# Xcode 를 명시적으로 고른다. Swift 릴리스마다 고정을 옮길 때 이 잡이 먼저 알려 준다.
jobs:
  test:
    name: Build, test and gate coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      # 해석된 의존성 소스만 캐시한다. .build 전체에는 러너 작업 경로가 절대 경로로
      # 박힌 빌드 상태가 들어 있어, 잡 사이에 옮기면 조용히 깨진 증분 빌드가 된다.
      - name: Cache resolved dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # 커버리지 계측은 빌드 플래그가 달라, 계측 없이 먼저 빌드하면 의존성이 두 번
      # 컴파일된다. 첫 실행에서 그 낭비가 2분이었다. 같은 플래그로 한 번만 빌드한다.
      - name: Build
        run: swift build --build-tests --enable-code-coverage

      - name: Test with coverage gate
        run: Scripts/coverage.sh

  self-analysis:
    name: Analyze this repository with itself
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Cache resolved dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # 도구가 읽을 인덱스를 만든다. 이 단계가 곧 도구의 전제 조건 문서이기도 하다.
      # 인덱스는 무언가 컴파일될 때만 만들어진다. 새 체크아웃이라 항상 컴파일되지만,
      # 캐시 구성을 바꾸다 이 전제가 깨지면 조용히 "인덱스 없음"으로 실패하므로 확인한다.
      - name: Build with indexing enabled
        run: |
          swift build -Xswiftc -index-store-path -Xswiftc .index-store
          if [ ! -d .index-store ]; then
            echo "인덱스 스토어가 만들어지지 않았습니다. 컴파일이 실제로 일어났는지 확인하세요." >&2
            exit 1
          fi
          echo "CARTOGRAPH=$(swift build --show-bin-path)/cartograph" >> "$GITHUB_ENV"

      # CLI 껍데기와 인덱스 스토어 입출력은 단위 테스트로 덮기 어렵다.
      # 실제 빌드된 도구로 이 저장소를 분석해 그 경로를 끝까지 태운다.
      - name: Circular dependencies
        run: |
          "$CARTOGRAPH" cycles --index-store .index-store --strict

      - name: Unused declarations
        run: |
          "$CARTOGRAPH" dead --index-store .index-store --strict

      - name: Architecture rules
        run: |
          "$CARTOGRAPH" rules --index-store .index-store --strict

      - name: Architecture metrics
        run: |
          "$CARTOGRAPH" metrics --index-store .index-store

      - name: Export graphs
        run: |
          "$CARTOGRAPH" graph --index-store .index-store --format dot     -o build/graph.dot
          "$CARTOGRAPH" graph --index-store .index-store --format json    -o build/graph.json
          "$CARTOGRAPH" graph --index-store .index-store --format html    -o build/graph.html
          "$CARTOGRAPH" graph --index-store .index-store --format mermaid -o build/graph.mmd

      - uses: actions/upload-artifact@v7
        with:
          name: dependency-graph
          path: build/
