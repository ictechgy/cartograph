name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Package.swift 는 툴체인(Swift 6.4)에 대응하는 indexstore-db 릴리스 브랜치의 커밋을 고정한다.
# 러너 기본 Xcode 가 그보다 낮으면 빌드가 실패하므로, 이미지에 있는 가장 새로운
# Xcode 를 명시적으로 고른다. Swift 릴리스마다 고정을 옮길 때 이 잡이 먼저 알려 준다.
jobs:
  indexstore-comparison:
    name: Compare the pinned IndexStoreDB CLI
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Verify comparison contracts
        run: |
          python3 Scripts/verify-indexstore-benchmark.py
          python3 Scripts/verify-indexstore-project.py
          python3 Scripts/verify-prepared-indexstore-sessions.py
          python3 Scripts/verify-query-phases.py
          python3 Scripts/verify-indexstore-evidence.py
          python3 Scripts/verify-indexstore-bundles.py
          python3 Scripts/verify-indexstore-mixed.py
          python3 Scripts/verify-indexstore-pilot-evidence.py
          python3 Scripts/verify-module-refresh-diagnostic.py
          python3 Scripts/verify-native-measurement-contract.py
          python3 Scripts/verify-native-calibration-contract.py
          python3 Scripts/verify-native-generation-contract.py
          python3 -m unittest discover -s Scripts/benchmark-inputs -v
          python3 Scripts/verify-sdk-discovery-contract.py

      # 두 제품 모두 새 release 스크래치에서 빌드한다. 전역 SDK/의존성 캐시는
      # 지우지 않으며, 획득·빌드 비용과 각 질의의 원시 출력을 증거에 남긴다.
      - name: Compare real executables on the same compiler index
        id: tools
        run: |
          set +e
          python3 Scripts/benchmark-indexstore-cli.py \
            --cartograph-package "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/indexstore-cli-benchmark" \
            --repetitions 5 --jobs 3 --setup-timeout 1500 \
            > "$RUNNER_TEMP/indexstore-cli-console.log" 2>&1
          status=$?
          if [ -d "$RUNNER_TEMP/indexstore-cli-benchmark" ]; then
            mkdir -p "$RUNNER_TEMP/indexstore-cli-benchmark/setup"
            cp "$RUNNER_TEMP/indexstore-cli-console.log" \
              "$RUNNER_TEMP/indexstore-cli-benchmark/setup/driver.stdout"
          fi
          exit "$status"

      - name: Validate the frozen public Swift project
        run: |
          set +e
          python3 Scripts/benchmark-indexstore-project.py \
            --setup-results "$RUNNER_TEMP/indexstore-cli-benchmark/results.json" \
            --output "$RUNNER_TEMP/indexstore-project-validation" \
            --cartograph-graph-mode include-self-loops \
            --repetitions 4 --jobs 3 \
            > "$RUNNER_TEMP/indexstore-project-console.log" 2>&1
          status=$?
          if [ -d "$RUNNER_TEMP/indexstore-project-validation" ]; then
            mkdir -p "$RUNNER_TEMP/indexstore-project-validation/setup"
            cp "$RUNNER_TEMP/indexstore-project-console.log" \
              "$RUNNER_TEMP/indexstore-project-validation/setup/driver.stdout"
          fi
          exit "$status"

      - name: Diagnose prepared sessions on the frozen public project
        timeout-minutes: 10
        run: |
          python3 Scripts/benchmark-prepared-indexstore-sessions.py \
            --project-results "$RUNNER_TEMP/indexstore-project-validation/results.json"

      # 이전 영향 캐시 실험은 보존된 증거로 남기고 같은 한 번의 기준 빌드를 질의 실험으로 돌린다.
      - name: Prepare the exact pre-query release baseline
        id: query_baseline
        timeout-minutes: 12
        run: |
          python3 - <<'PY'
          import argparse, importlib.util, json, os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "query-projection-measurement"
          root.mkdir()
          spec = importlib.util.spec_from_file_location("base", "Scripts/benchmark-indexstore-cli.py")
          base = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(base)
          validation = Path(os.environ["RUNNER_TEMP"]) / "indexstore-project-validation"
          setup = json.loads((Path(os.environ["RUNNER_TEMP"]) / "indexstore-cli-benchmark/results.json").read_text())
          revision = "54b1b41c06efe42ac20704c1ea373d4b6c3a444b"
          checkout = root / "original-source"
          checkout.mkdir()
          try:
              for label, command in [
                  ("init", ["git", "init", "-q"]),
                  ("remote", ["git", "remote", "add", "origin", "https://github.com/ictechgy/cartograph.git"]),
                  ("fetch", ["git", "fetch", "--depth", "1", "origin", revision]),
                  ("checkout", ["git", "checkout", "--detach", "FETCH_HEAD"]),
              ]:
                  base.run(command, checkout, root / "acquisition" / label, 60)
              head, _ = base.capture(["git", "rev-parse", "HEAD"], checkout, root / "acquisition/head", timeout=60)
              assert head.strip() == revision
              original = base.prepare_cartograph(
                  argparse.Namespace(cartograph_package=checkout, cartograph=None, jobs=3, setup_timeout=600),
                  Path(setup["toolchain"]["swiftc"]), root / "original-build")
              base.save(validation / "setup" / "query-baseline.json", {
                  "status": "passed", "cartograph": original, "toolchain": setup["toolchain"],
              })
          finally:
              evidence = validation / "setup" / "query-baseline-build"
              evidence.mkdir()
              if (root / "acquisition").is_dir():
                  shutil.copytree(root / "acquisition", evidence / "acquisition")
              if (root / "original-build" / "setup").is_dir():
                  shutil.copytree(root / "original-build" / "setup", evidence / "release")
          PY

      - name: Compare paired query phases against the exact pre-query baseline
        timeout-minutes: 6
        run: |
          python3 Scripts/diagnose-query-phases.py \
            --project-results "$RUNNER_TEMP/indexstore-project-validation/results.json" \
            --baseline-setup-results "$RUNNER_TEMP/indexstore-project-validation/setup/query-baseline.json" \
            --baseline-revision 54b1b41c06efe42ac20704c1ea373d4b6c3a444b

      - name: Diagnose compiler module re-indexing
        if: always() && steps.tools.outcome == 'success'
        run: |
          python3 Scripts/diagnose-indexstore-module-refresh.py \
            --setup-results "$RUNNER_TEMP/indexstore-cli-benchmark/results.json" \
            --output "$RUNNER_TEMP/indexstore-cli-benchmark/runs/module-refresh-diagnostic" \
            --workspace "$RUNNER_TEMP/indexstore-module-diagnostic-work" \
            --sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            --objdump "$(xcrun --find llvm-objdump)"

      - name: Validate fresh shared compiler generations for mixed iOS
        id: mixed
        if: always() && steps.tools.outcome == 'success'
        run: |
          set +e
          python3 Scripts/benchmark-indexstore-mixed.py \
            --setup-results "$RUNNER_TEMP/indexstore-cli-benchmark/results.json" \
            --compiler-index-policy fresh-shared-v2 \
            --output "$RUNNER_TEMP/indexstore-mixed-validation" \
            > "$RUNNER_TEMP/indexstore-mixed-console.log" 2>&1
          status=$?
          if [ -d "$RUNNER_TEMP/indexstore-mixed-validation" ]; then
            mkdir -p "$RUNNER_TEMP/indexstore-mixed-validation/setup"
            cp "$RUNNER_TEMP/indexstore-mixed-console.log" \
              "$RUNNER_TEMP/indexstore-mixed-validation/setup/driver.stdout"
          fi
          exit "$status"

      # 최종 성능 세션이 아니라 고정 합성 진단이다. 메모리 표본은 별도 아티팩트로 보존한다.
      - name: Validate native measurement helpers
        id: measurement
        run: |
          python3 Scripts/validate-native-measurement.py \
            --output "$RUNNER_TEMP/measurement-helper-raw" \
            --dependencies "$RUNNER_TEMP/measurement-helper-dependencies"

      - name: Prepare normalized measurement evidence
        if: always() && !cancelled() && steps.measurement.outcome != 'skipped'
        id: measurement_normalize
        run: |
          python3 Scripts/normalize-indexstore-evidence.py \
            --input "$RUNNER_TEMP/measurement-helper-raw" \
            --output "$RUNNER_TEMP/measurement-helper-public" \
            --prefix "WORKSPACE=$GITHUB_WORKSPACE" \
            --prefix "RUNNER_TEMP=$RUNNER_TEMP" \
            --prefix "RUNNER_HOME=$HOME" \
            --prefix "DEVELOPER=$(xcode-select -p)" \
            --prefix "PRIVATE=/private" --prefix "USR=/usr" --prefix "OPT=/opt" \
            --prefix "BIN=/bin" --prefix "DEV=/dev" --prefix "TEMP=/var"

      - name: Preserve normalized measurement evidence
        if: always() && steps.measurement_normalize.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: measurement-helper-validation
          path: ${{ runner.temp }}/measurement-helper-public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # 검색 경계 제안만 만든다. SDK 전체 봉인/승인이나 최종 성능 세션은 실행하지 않는다.
      - name: Discover native SDK input roots
        id: sdk_discovery
        if: always() && !cancelled() && steps.mixed.outcome == 'success'
        run: |
          set +e
          python3 Scripts/validate-native-sdk-discovery.py \
            --lifecycle-results "$RUNNER_TEMP/indexstore-mixed-validation/validation/results.json" \
            --output "$RUNNER_TEMP/sdk-discovery-raw" \
            --attempt-output "$RUNNER_TEMP/sdk-discovery-attempt" \
            > "$RUNNER_TEMP/sdk-discovery-console.log" 2>&1
          status=$?
          if [ -d "$RUNNER_TEMP/sdk-discovery-raw" ]; then
            mkdir -p "$RUNNER_TEMP/sdk-discovery-raw/setup"
            cp "$RUNNER_TEMP/sdk-discovery-console.log" \
              "$RUNNER_TEMP/sdk-discovery-raw/setup/driver.stdout"
          fi
          exit "$status"

      - name: Prepare safe SDK discovery evidence
        id: sdk_normalize
        if: always() && !cancelled() && steps.sdk_discovery.outcome != 'skipped'
        run: |
          python3 Scripts/normalize-sdk-discovery-evidence.py \
            --lifecycle-results "$RUNNER_TEMP/indexstore-mixed-validation/validation/results.json" \
            --scratch-root "$RUNNER_TEMP" \
            --input "$RUNNER_TEMP/sdk-discovery-raw" \
            --attempt "$RUNNER_TEMP/sdk-discovery-attempt" \
            --ready-output "$GITHUB_OUTPUT" \
            --output "$RUNNER_TEMP/sdk-discovery-public" \
            --prefix "WORKSPACE=$GITHUB_WORKSPACE" \
            --prefix "RUNNER_TEMP=$RUNNER_TEMP" \
            --prefix "RUNNER_HOME=$HOME" \
            --prefix "DEVELOPER=$(xcode-select -p)" \
            --prefix "APPLICATIONS=/Applications" --prefix "LIBRARY=/Library" \
            --prefix "SYSTEM=/System" --prefix "PRIVATE=/private" \
            --prefix "USR=/usr" --prefix "OPT=/opt" --prefix "BIN=/bin" \
            --prefix "DEV=/dev" --prefix "TEMP=/var"

      - name: Preserve normalized SDK discovery evidence
        if: always() && steps.sdk_normalize.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sdk-input-discovery
          path: ${{ runner.temp }}/sdk-discovery-public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Validate one restored-state bound runtime pair
        id: actual_arm
        if: always() && !cancelled() && steps.mixed.outcome == 'success' && steps.measurement.outcome == 'success' && steps.sdk_discovery.outcome != 'skipped'
        run: |
          python3 -I -S -B Scripts/benchmark-actual-arm/correctness_controller.py \
            --repository "$GITHUB_WORKSPACE" \
            --lifecycle "$RUNNER_TEMP/indexstore-mixed-validation/validation/results.json" \
            --setup "$RUNNER_TEMP/indexstore-cli-benchmark/results.json" \
            --measurement "$RUNNER_TEMP/measurement-helper-raw/results.json" \
            --scratch-root "$RUNNER_TEMP"

      - name: Prepare safe actual-arm correctness evidence
        id: actual_arm_normalize
        if: always() && !cancelled() && steps.actual_arm.outcome != 'skipped'
        run: |
          python3 -I -S -B Scripts/benchmark-actual-arm/publish_correctness.py \
            --repository "$GITHUB_WORKSPACE" \
            --lifecycle "$RUNNER_TEMP/indexstore-mixed-validation/validation/results.json" \
            --setup "$RUNNER_TEMP/indexstore-cli-benchmark/results.json" \
            --measurement "$RUNNER_TEMP/measurement-helper-raw/results.json" \
            --scratch-root "$RUNNER_TEMP"

      - name: Preserve normalized actual-arm correctness evidence
        if: always() && steps.actual_arm_normalize.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: actual-arm-correctness-validation
          path: ${{ runner.temp }}/actual-arm-correctness-public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14


      - name: Prepare portable public evidence
        id: normalize
        if: always()
        run: |
          toolchain="$(dirname "$(dirname "$(xcrun --find swiftc)")")"
          prefixes=(
            --prefix "WORKSPACE=$GITHUB_WORKSPACE"
            --prefix "RUNNER_TEMP=$RUNNER_TEMP"
            --prefix "HOME=$HOME"
            --prefix "TOOLCHAIN=$toolchain"
            --prefix "DEVELOPER=$(xcode-select -p)"
            --prefix "TEMP_FILES=$TMPDIR"
            --prefix "APPLICATIONS=/Applications"
            --prefix "LIBRARY=/Library"
            --prefix "SYSTEM=/System"
            --prefix "USR=/usr"
            --prefix "OPT=/opt"
            --prefix "BIN=/bin"
            --prefix "DEV=/dev"
            --prefix "TEMP=/var"
            --prefix "ARGUMENT_PARSER_BUILD=/swift-argument-parser.build"
            --prefix "CARTOGRAPH_BUILD=/cartograph.build"
            --prefix "INDEXSTORE_BUILD=/indexstore-db.build"
          )
          python3 Scripts/normalize-indexstore-bundles.py \
            --synthetic "$RUNNER_TEMP/indexstore-cli-benchmark" \
            --argument-parser "$RUNNER_TEMP/indexstore-project-validation" \
            --mixed-setup "$RUNNER_TEMP/indexstore-mixed-validation" \
            --mixed-ios "$RUNNER_TEMP/indexstore-mixed-validation/validation" \
            --output "$RUNNER_TEMP/indexstore-cli-public" \
            --github-output "$GITHUB_OUTPUT" "${prefixes[@]}"

      # 원본은 러너 안에만 둔다. 바이너리 인덱스에는 절대 경로가 남으므로
      # 공개 업로드는 검증된 정규화 텍스트와 원본/정규화 해시 목록으로 제한한다.
      - name: Preserve normalized comparison evidence
        if: always() && steps.normalize.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: indexstore-cli-comparison
          path: ${{ runner.temp }}/indexstore-cli-public/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  test:
    name: Build, test and gate coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      # 해석된 의존성 소스만 캐시한다. .build 전체에는 러너 작업 경로가 절대 경로로
      # 박힌 빌드 상태가 들어 있어, 잡 사이에 옮기면 조용히 깨진 증분 빌드가 된다.
      - name: Cache resolved dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # 커버리지 계측은 빌드 플래그가 달라, 계측 없이 먼저 빌드하면 의존성이 두 번
      # 컴파일된다. 첫 실행에서 그 낭비가 2분이었다. 같은 플래그로 한 번만 빌드한다.
      - name: Build
        run: swift build --build-tests --enable-code-coverage

      - name: Test with coverage gate
        timeout-minutes: 15
        run: |
          python3 Scripts/verify-coverage-inputs.py
          Scripts/coverage.sh

      - name: Verify isolated impact expansion cost
        timeout-minutes: 3
        run: |
          set -o pipefail
          : "${CARTOGRAPH_COVERAGE_DIR:?coverage diagnostics directory missing}"
          log="$CARTOGRAPH_COVERAGE_DIR/impact-expansion-timing.log"
          CARTOGRAPH_IMPACT_EXPANSION_TIMING=1 swift test --skip-build --enable-code-coverage \
            --filter '^CartographAnalysisTests\.ImpactSelectionExpansionTests/narrowSelectionSkipsFullEdgeScan\(\)(/|$)' \
            2>&1 | tee "$log"
          python3 - "$log" <<'PY'
          import math, pathlib, statistics, sys
          rows = [dict(field.split("=", 1) for field in line.split()[1:])
                  for line in pathlib.Path(sys.argv[1]).read_text().splitlines()
                  if line.startswith("ImpactExpansionTiming ")]
          assert len(rows) == 7, "Expected one warm-up, five measured pairs and one summary"
          def positive(row, field):
              value = float(row[field])
              assert math.isfinite(value) and value > 0, "Invalid timing value"
              return value
          assert rows[0]["warmup"] == "1" and rows[0]["baselineFirst"] == "true"
          positive(rows[0], "baselineSeconds"); positive(rows[0], "optimizedSeconds")
          ratios = []
          for number, row in enumerate(rows[1:6], 1):
              assert row["pair"] == str(number) and row["baselineFirst"] == str(number % 2 == 1).lower()
              ratio = positive(row, "baselineSeconds") / positive(row, "optimizedSeconds")
              assert math.isclose(ratio, positive(row, "ratio"), rel_tol=1e-12)
              ratios.append(ratio)
          assert rows[6]["pairs"] == "5" and rows[6]["requiredGreaterThan"] == "4"
          median = statistics.median(ratios)
          assert math.isclose(median, positive(rows[6], "medianBaselineOverOptimized"), rel_tol=1e-12)
          assert median > 4, "The original strict 4x impact-expansion requirement failed"
          PY

      - name: Preserve integration diagnostics
        if: always() && env.CARTOGRAPH_COVERAGE_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration-diagnostics
          path: |
            ${{ env.CARTOGRAPH_COVERAGE_DIR }}/*.log
            ${{ env.CARTOGRAPH_COVERAGE_DIR }}/*/result.json
            ${{ env.CARTOGRAPH_COVERAGE_DIR }}/*/*.log
          retention-days: 7

  self-analysis:
    name: Analyze this repository with itself
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Cache resolved dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # 도구가 읽을 인덱스를 만든다. 이 단계가 곧 도구의 전제 조건 문서이기도 하다.
      # -Xswiftc -index-store-path 는 빌드 시스템에 따라 무시된다(Swift 6.4 기본값에서 그렇다).
      # 플래그를 쓰지 않고 평범하게 빌드한 뒤 도구의 자동 탐색에 맡긴다.
      # 인덱스가 없으면 도구가 종료 코드 2 로 실패하므로 다음 단계가 그대로 게이트가 된다.
      - name: Build
        run: |
          swift build
          echo "CARTOGRAPH=$(swift build --show-bin-path)/cartograph" >> "$GITHUB_ENV"

      # CLI 껍데기와 인덱스 스토어 입출력은 단위 테스트로 덮기 어렵다.
      # 실제 빌드된 도구로 이 저장소를 분석해 그 경로를 끝까지 태운다.
      # 문서화한 종료 코드가 실제로 지켜지는지 확인한다. 상수를 단언하는 단위
      # 테스트는 상수가 동작과 맞는지는 말해 주지 않는다. 실제로 --help 가 2 로
      # 실패한 적이 있고 단위 테스트는 전부 통과했다.
      - name: CLI contract
        run: |
          Scripts/verify-cli-contract.sh "$CARTOGRAPH"
          python3 Scripts/verify-action.py
          python3 Scripts/verify-release-workflow.py
          python3 Scripts/verify-index-cache.py
          python3 Scripts/verify-recursive-calls.py --cartograph "$CARTOGRAPH"
          python3 Scripts/verify-index-freshness-contract.py
          python3 Scripts/verify-index-freshness.py --cartograph "$CARTOGRAPH"
          python3 Scripts/verify-header-records-contract.py
          python3 Scripts/verify-header-records.py --cartograph "$CARTOGRAPH"

      - name: Circular dependencies
        run: |
          "$CARTOGRAPH" cycles --strict
          # 모듈 레벨은 Swift 가 구조적으로 막고 있어 절대 발화하지 않는다.
          # 이 게이트가 무언가를 실제로 검사하는 것은 타입 레벨부터다.
          "$CARTOGRAPH" cycles --level type --strict

      - name: Unused declarations
        run: |
          "$CARTOGRAPH" dead --strict

      - name: False-positive corpus
        run: |
          Scripts/verify-fixtures.sh "$CARTOGRAPH"

      - name: Value-flow and bridge runtime regressions
        run: python3 Scripts/verify-analysis-blindspots.py "$CARTOGRAPH"

      - name: Change impact and historical snapshots
        run: python3 Scripts/verify-change-impact.py --cartograph "$CARTOGRAPH"

      - name: Runtime contract execution and stale evidence
        run: python3 Scripts/verify-runtime-contracts.py --cartograph "$CARTOGRAPH"

      - name: Automatic runtime discovery corpus
        run: python3 Scripts/verify-runtime-discovery.py --cartograph "$CARTOGRAPH"

      - name: KVC, predicates and immutable factory registries
        run: |
          python3 Scripts/verify-runtime-keypaths.py --cartograph "$CARTOGRAPH"
          python3 Scripts/verify-runtime-registry.py --cartograph "$CARTOGRAPH"

      - name: Core Data model version and runtime behavior
        run: >-
          python3 Scripts/verify-coredata-versions.py --cartograph "$CARTOGRAPH"
          --output-dir "$RUNNER_TEMP/cartograph-coredata-versions"

      - name: Core Data executable, generated classes and MCP evidence
        run: >-
          python3 Scripts/verify-coredata-build-evidence.py --cartograph "$CARTOGRAPH"
          --output-dir "$RUNNER_TEMP/cartograph-coredata-build"

      - name: Native runtime collection
        run: python3 Scripts/verify-runtime-collection.py --cartograph "$CARTOGRAPH"

      - name: MCP sessions and invalidation
        run: python3 Scripts/verify-mcp.py --cartograph "$CARTOGRAPH"

      # 개별 명령과 같은 검사를 한 번의 인덱스 로딩으로 조립하는 경로도 검증한다.
      - name: Combined CI checks
        run: '"$CARTOGRAPH" check --strict --report-format github-actions'

      # 커밋된 action.yml 을 실제로 태운다. 로컬 액션은 체크아웃된 리비전에서
      # 실행되므로 릴리스 자산을 받지 않고, 이미 빌드한 바이너리를 넘겨 배선
      # (바이너리 해석·인자 조립·종료 코드·SARIF 기록)을 검증한다. 업로드는
      # 코드 스캐닝 설정에 의존하므로 스모크에서는 끈다.
      - name: GitHub Action smoke
        uses: ./
        with:
          binary: ${{ env.CARTOGRAPH }}
          build: none
          command: check
          upload-sarif: "false"
          sarif-file: "${{ runner.temp }}/cartograph-action-smoke.sarif"

      - name: Verify the action wrote SARIF
        run: test -s "${{ runner.temp }}/cartograph-action-smoke.sarif"

      - name: Architecture rules
        run: |
          "$CARTOGRAPH" rules --strict

      - name: Architecture metrics
        run: |
          "$CARTOGRAPH" metrics

      - name: Export graphs
        run: |
          "$CARTOGRAPH" graph --format dot     -o build/graph.dot
          "$CARTOGRAPH" graph --format json    -o build/graph.json
          "$CARTOGRAPH" graph --format html    -o build/graph.html
          "$CARTOGRAPH" graph --format mermaid -o build/graph.mmd

      - uses: actions/upload-artifact@v7
        with:
          name: dependency-graph
          path: build/
