name: Native environment observation only

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit with separately approved native prerequisites
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-observer-sdk-admission
  cancel-in-progress: false

jobs:
  native-environment-observation:
    if: github.repository == 'ictechgy/cartograph'
    runs-on: macos-26
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      MANIFEST_SHA: cff07afd1afb794261128c744be31bcbcfe00ec905d90f65c15a1c261e5fd1b3
    steps:
      - name: Require exact reviewed source and image
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$DISPATCH_SHA" ]]
          [[ "$ImageOS" == 'macos26' ]]
          [[ "$ImageVersion" == '20260907.0351.1' ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$RUNNER_TEMP" =~ ^/[A-Za-z0-9_./-]+$ ]]
          prefix="$RUNNER_TEMP/native-environment-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for suffix in raw staging public invocation-status.json publication-status.json; do
            [[ ! -e "$prefix-$suffix" && ! -L "$prefix-$suffix" ]] || exit 125
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      # 별도 승인된 동일 SHA의 일반 CI가 먼저 완료되어야 한다.
      - name: Verify the selected mock-only and source contracts
        id: controls
        timeout-minutes: 1
        run: |
          /opt/homebrew/opt/python@3.14/bin/python3.14 -I -S -B -m unittest discover -s Scripts/benchmark-inputs -p test_native_environment_observation.py -v

      - name: Observe at most two fixed environment samples
        id: observe
        timeout-minutes: 2
        run: |
          umask 077
          raw="$RUNNER_TEMP/native-environment-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-raw"
          receipt="$RUNNER_TEMP/native-environment-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-invocation-status.json"
          prefix="$RUNNER_TEMP/native-environment-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for suffix in raw staging public invocation-status.json publication-status.json; do
            [[ ! -e "$prefix-$suffix" && ! -L "$prefix-$suffix" ]] || exit 125
          done
          set +e
          /opt/homebrew/opt/python@3.14/bin/python3.14 -I -S -B \
            Scripts/validate-native-environment-observation.py --supervise \
            --source-sha "$SOURCE_SHA" --raw "$raw" --manifest-sha "$MANIFEST_SHA"
          status=$?
          if [[ ! -e "$receipt" && ! -L "$receipt" ]] && (set -o noclobber; printf '{"schema_version":1,"run_id":"%s","run_attempt":"%s","job_id":"native-environment-observation","source_sha":"%s","invocation_tag":"fixed-native-environment-observation-v1","raw_root":"%s","original_supervisor_exit":%d,"status_finalized":true}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_SHA" "$raw" "$status" > "$receipt"); then
            printf 'status_finalized=true\n' >> "$GITHUB_OUTPUT"
            output_status=$?
            if [[ "$output_status" != 0 && "$status" == 0 ]]; then status=125; fi
          elif [[ "$status" == 0 ]]; then
            status=125
          fi
          exit "$status"

      - name: Prepare independently gated scanned evidence
        id: publish
        if: always() && !cancelled() && steps.controls.outcome == 'success' && steps.observe.outcome != 'skipped' && steps.observe.outputs.status_finalized == 'true' && steps.observe.outputs.publication_bootstrap == 'true'
        timeout-minutes: 1
        run: |
          /opt/homebrew/opt/python@3.14/bin/python3.14 -I -S -B \
            Scripts/validate-native-environment-observation.py --publish \
            --source-sha "$SOURCE_SHA" --manifest-sha "$MANIFEST_SHA" \
            --raw "$RUNNER_TEMP/native-environment-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-raw" \
            --public "$RUNNER_TEMP/native-environment-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-public" \
            --shell-status-finalized '${{ steps.observe.outputs.status_finalized }}' \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --job-id native-environment-observation

      # 작업 또는 취소 시간 제한으로 보존 단계 자체가 생략될 수 있다.
      - name: Retain only finalized public evidence
        if: always() && !cancelled() && steps.publish.outcome == 'success' && steps.publish.outputs.ready == 'true' && steps.publish.outputs.manifest_sha256 != '' && steps.publish.outputs.run_id == github.run_id && steps.publish.outputs.run_attempt == github.run_attempt && steps.publish.outputs.source_sha == inputs.source_sha
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-environment-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-environment-observation-${{ github.run_id }}-${{ github.run_attempt }}-public/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
