name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true
        type: string
      source_sha:
        description: "Full reviewed source commit SHA on main (must equal the dispatch ref)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release binary
    runs-on: macos-latest
    steps:
      - name: Validate manual source input
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$REQUESTED_SHA" != "$GITHUB_SHA" ]; then
            echo "Manual source SHA must be the full reviewed dispatch-ref commit." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Resolve version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REQUESTED_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          version="$REQUESTED_TAG"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME}"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: expected MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          expected_sha="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            expected_sha="$REQUESTED_SHA"
          elif [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" != "refs/tags/$version" ]; then
            echo "Release requires an explicit manual source or a version-tag push." >&2
            exit 1
          fi
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || [ "$source_sha" != "$expected_sha" ]; then
            echo "Checked-out source does not match the requested commit." >&2
            exit 1
          fi
          # HEAD가 같아도 체크아웃 뒤에 바뀐 트리는 리뷰한 소스가 아니다. swift build는 .build/·.swiftpm/ 같은 무시 경로도
          # 읽으므로 무시 파일까지 본다. --untracked-files=all은 git 설정이 추적 안 된 파일을 숨기지 못하게 한다.
          # git이 실패하면 대입에서 멈춘다.
          changes="$(git status --porcelain --ignored --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "Checked-out source has local changes; release only the clean reviewed commit." >&2
            # 어떤 경로가 걸렸는지 로그에서 바로 보이게 앞부분만 출력한다.
            head -n 20 <<< "$changes" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          # 소스의 버전 상수와 태그가 어긋나면 사용자가 --version 으로 잘못된 값을 본다.
          declared="$(grep -oE 'version = "[^"]+"' Sources/CartographCore/Cartograph.swift | head -1 | cut -d'"' -f2)"
          if [ "$declared" != "$version" ]; then
            echo "태그($version)와 Cartograph.version($declared)이 다릅니다." >&2
            exit 1
          fi

      # 리뷰를 거쳐 main에 머지된 커밋만 게시한다. 태그 push와 수동 실행 모두 같고, 핫픽스 브랜치도 예외가 없다.
      # SHA로 고정한 checkout은 그 커밋 하나만 얕게 받아 origin/main이 없다. 잘린 이력에 기대지 않도록 main까지
      # 전체 이력을 받는다(공개 저장소라 자격 증명이 필요 없다). --unshallow는 얕은 checkout을 전제한다.
      # swift build가 체크아웃을 읽기 전에 멈추고, git이 판정하지 못한 경우(128)는 main에 없는 경우(1)와 구별한다.
      - name: Require the release source on main
        run: |
          if ! git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main; then
            echo "Could not fetch main to check the release source; see the git error above and rerun." >&2
            exit 1
          fi
          ancestry=0
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main || ancestry=$?
          if [ "$ancestry" -eq 1 ]; then
            echo "Release source $SOURCE_SHA is not on main; merge the reviewed pull request and release from main." >&2
            exit 1
          elif [ "$ancestry" -ne 0 ]; then
            echo "Could not check whether release source $SOURCE_SHA is on main (git merge-base exited $ancestry)." >&2
            exit 1
          fi

      # Intel Mac 사용자도 받아 쓸 수 있도록 두 아키텍처를 한 바이너리에 담는다.
      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package
        run: |
          binary="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/cartograph"
          lipo -info "$binary"
          mkdir -p dist/cartograph
          cp "$binary" dist/cartograph/
          cp LICENSE README.md dist/cartograph/
          mkdir -p dist/cartograph/docs
          cp docs/QUERY-EVIDENCE.md docs/ENUM-CHANGE-REVIEW.md docs/FOLLOWUP-REVIEW.md dist/cartograph/docs/
          mkdir -p dist/cartograph/Scripts
          cp Scripts/cartograph-git-impact.py Scripts/cartograph-swiftpm-scope.py dist/cartograph/Scripts/
          archive="cartograph-${VERSION}-macos-universal.tar.gz"
          tar -C dist -czf "$archive" cartograph
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "$archive" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # 배포하기 전에 압축을 푼 그 바이너리로 CLI 계약 전체를 검증한다.
      # 첫 릴리스 시도가 여기서 막혔다. --help 가 종료 코드 2 로 실패하고 있었다.
      - name: Verify the packaged binary
        run: |
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cartograph/cartograph" --version
          test -s "$RUNNER_TEMP/cartograph/docs/FOLLOWUP-REVIEW.md"
          cmp docs/FOLLOWUP-REVIEW.md "$RUNNER_TEMP/cartograph/docs/FOLLOWUP-REVIEW.md"
          test -s "$RUNNER_TEMP/cartograph/docs/QUERY-EVIDENCE.md"
          cmp docs/QUERY-EVIDENCE.md "$RUNNER_TEMP/cartograph/docs/QUERY-EVIDENCE.md"
          test -s "$RUNNER_TEMP/cartograph/docs/ENUM-CHANGE-REVIEW.md"
          cmp docs/ENUM-CHANGE-REVIEW.md "$RUNNER_TEMP/cartograph/docs/ENUM-CHANGE-REVIEW.md"
          lipo "$RUNNER_TEMP/cartograph/cartograph" -verify_arch arm64
          lipo "$RUNNER_TEMP/cartograph/cartograph" -verify_arch x86_64
          Scripts/verify-cli-contract.sh "$RUNNER_TEMP/cartograph/cartograph"
          Scripts/verify-fixtures.sh "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-analysis-blindspots.py "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-change-impact.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"
          cmp Scripts/cartograph-git-impact.py "$RUNNER_TEMP/cartograph/Scripts/cartograph-git-impact.py"
          cmp Scripts/cartograph-swiftpm-scope.py "$RUNNER_TEMP/cartograph/Scripts/cartograph-swiftpm-scope.py"
          python3 "$RUNNER_TEMP/cartograph/Scripts/cartograph-swiftpm-scope.py" --help
          python3 Scripts/verify-runtime-contracts.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-runtime-discovery.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-runtime-keypaths.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-runtime-registry.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-coredata-versions.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-coredata-build-evidence.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-runtime-collection.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-runtime-window.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"
          python3 Scripts/verify-mcp.py --cartograph "$RUNNER_TEMP/cartograph/cartograph"

      # 기존 태그는 이동하지 않는다. GITHUB_TOKEN으로 만든 태그는 새 push 실행을 만들지 않는다.
      - name: Ensure the exact release tag after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          existing="$(git ls-remote --refs origin "refs/tags/$VERSION")"
          if [ -z "$existing" ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
              echo "The pushed release tag disappeared; refusing to recreate it." >&2
              exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$VERSION" -f "sha=$SOURCE_SHA" >/dev/null
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$VERSION"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SOURCE_SHA" ]; then
            echo "Release tag points to a different commit; it will not be moved." >&2
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          See [CHANGELOG.md](https://github.com/ictechgy/cartograph/blob/${VERSION}/CHANGELOG.md).

          ## Install

          \`\`\`bash
          brew install ictechgy/tap/cartograph
          # or
          mint install ictechgy/cartograph@${VERSION}
          \`\`\`

          ## Asset

          \`${ARCHIVE}\` — macOS universal (arm64 + x86_64), macOS 14 or later.

          \`\`\`
          sha256  ${SHA256}
          \`\`\`
          NOTES
          gh release create "$VERSION" "$ARCHIVE" --title "$VERSION" --notes-file notes.md --verify-tag

      # tap 저장소는 다른 저장소라 기본 GITHUB_TOKEN 으로는 쓸 수 없다.
      # HOMEBREW_TAP_TOKEN 시크릿이 있을 때만 formula 를 갱신하고, 없으면 배포 미완료 범위를 알린다.
      - name: Update the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::Homebrew tap update and installation verification skipped: HOMEBREW_TAP_TOKEN is not configured."
            echo "HOMEBREW_TAP_TOKEN is not configured; update the tap with these values:"
            echo "  url    https://github.com/ictechgy/cartograph/releases/download/${VERSION}/${ARCHIVE}"
            echo "  sha256 ${SHA256}"
            echo "  version ${VERSION}"
            echo "Homebrew tap update and clean installation remain unverified for ${VERSION}; the release archive is available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone "https://github.com/ictechgy/homebrew-tap.git" tap
          cd tap
          sed -i '' \
            -e "s|url \".*\"|url \"https://github.com/ictechgy/cartograph/releases/download/${VERSION}/${ARCHIVE}\"|" \
            -e "s|sha256 \".*\"|sha256 \"${SHA256}\"|" \
            -e "s|version \".*\"|version \"${VERSION}\"|" \
            Formula/cartograph.rb
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Formula/cartograph.rb")
          text = path.read_text()
          for helper in ["cartograph-git-impact.py", "cartograph-swiftpm-scope.py"]:
              install = f'    libexec.install "Scripts/{helper}"\n'
              anchor = '    bin.install "cartograph"\n'
              if install not in text:
                  if text.count(anchor) != 1:
                      raise SystemExit("Unrecognized Cartograph formula install block; update the tap manually")
                  text = text.replace(anchor, anchor + install)
              assertion = f'    assert_path_exists libexec/"{helper}"\n'
              anchor = '  test do\n'
              if assertion not in text:
                  if text.count(anchor) != 1:
                      raise SystemExit("Unrecognized Cartograph formula test block; update the tap manually")
                  text = text.replace(anchor, anchor + assertion)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cartograph ${VERSION}"
          auth="$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=Authorization: Basic ${auth}" push origin main
          cd ..
          brew install ictechgy/tap/cartograph
          brew test ictechgy/tap/cartograph
          installed="$(brew --prefix ictechgy/tap/cartograph)"
          test "$("$installed/bin/cartograph" --version)" = "$VERSION"
          brew cat ictechgy/tap/cartograph > "$RUNNER_TEMP/cartograph-installed-formula.rb"
          grep -F "${SHA256}" "$RUNNER_TEMP/cartograph-installed-formula.rb"
          cmp Scripts/cartograph-git-impact.py "$installed/libexec/cartograph-git-impact.py"
          python3 "$installed/libexec/cartograph-git-impact.py" --help
          cmp Scripts/cartograph-swiftpm-scope.py "$installed/libexec/cartograph-swiftpm-scope.py"
          python3 "$installed/libexec/cartograph-swiftpm-scope.py" --help
          python3 Scripts/verify-git-impact.py --cartograph "$installed/bin/cartograph"
          echo "Homebrew ${VERSION}: formula hash, clean installation, helper bytes and compiler-backed change flow verified." >> "$GITHUB_STEP_SUMMARY"
