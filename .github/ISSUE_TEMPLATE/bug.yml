name: Bug report
description: Something else is wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Commands you ran
      description: Include how the index store was produced.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cartograph and Xcode versions
    validations:
      required: true
