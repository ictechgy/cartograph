name: Cartograph Swift Analysis
description: >-
  Swift dead code, dependency cycles and architecture checks from compiler indexes, with SARIF upload to code scanning.
author: ictechgy

branding:
  icon: search
  color: blue

inputs:
  command:
    description: "Gate to run: check (dead + cycles + rules together), dead, cycles or rules."
    required: false
    default: check
  args:
    description: "Extra arguments for the command, for example --since origin/main --limit 500. Globs are not expanded."
    required: false
    default: ""
  version:
    description: "Release tag to download (for example 0.20.0), or latest for the newest release."
    required: false
    default: latest
  sha256:
    description: "Expected SHA-256 of the release archive. The download must match it as well as GitHub's digest."
    required: false
    default: ""
  binary:
    description: "Path to an existing cartograph binary. When set, no release is downloaded."
    required: false
    default: ""
  project:
    description: "Project root to analyze. The index store is discovered from it."
    required: false
    default: "."
  build:
    description: "Build the project before analyzing: swift runs swift build, none skips it."
    required: false
    default: swift
  sarif-file:
    description: "Where to write the SARIF 2.1.0 report."
    required: false
    default: cartograph.sarif
  upload-sarif:
    description: "Upload the report to GitHub code scanning. Needs permissions: security-events: write."
    required: false
    default: "true"
  fail-on-findings:
    description: "Fail the step when the gate reports findings. Set false for a report-only run."
    required: false
    default: "true"

outputs:
  sarif-id:
    description: "GitHub's upload receipt, empty when upload-sarif is disabled."
    value: ${{ steps.upload.outputs.sarif-id }}
  sarif-file:
    description: "Path to the SARIF report that was written, empty when none was produced."
    value: ${{ steps.run.outputs.sarif-file }}
  exit-code:
    description: "Raw cartograph exit code: 0 success, 1 findings, 2 tool failure, 64 usage error."
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Resolve the binary
      id: resolve
      shell: bash
      env:
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SHA256: ${{ inputs.sha256 }}
        # gh needs the token to read the release; this step never runs the downloaded binary.
        GH_TOKEN: ${{ github.token }}
      run: |
        # Cartograph reads libIndexStore from the Xcode toolchain; other runners cannot load it.
        if [ "$(uname -s)" != "Darwin" ]; then
          echo "::error::Cartograph runs on macOS runners only; it loads libIndexStore from an Xcode toolchain."
          exit 2
        fi
        if [ -n "$INPUT_BINARY" ]; then
          if [ -n "$INPUT_SHA256" ]; then
            echo "::error::sha256 checks a downloaded release archive, but binary skips the download; set only one."
            exit 64
          fi
          if [ ! -x "$INPUT_BINARY" ]; then
            echo "::error::binary input is not an executable: $INPUT_BINARY"
            exit 2
          fi
          echo "binary=$INPUT_BINARY" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The version reaches gh's request path and jq filter, so only exact forms pass.
        release_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
        sha256_pattern='^[0-9a-f]{64}$'
        digest_pattern='^sha256:[0-9a-f]{64}$'
        if [ -n "$INPUT_SHA256" ] && ! [[ "$INPUT_SHA256" =~ $sha256_pattern ]]; then
          echo "::error::sha256 must be 64 lowercase hex digits: the archive's SHA-256 without a sha256: prefix."
          exit 64
        fi
        version="$INPUT_VERSION"
        if [ -z "$version" ] || [ "$version" = "latest" ]; then
          version="$(gh api repos/ictechgy/cartograph/releases/latest --jq .tag_name)"
          if ! [[ "$version" =~ $release_pattern ]]; then
            echo "::error::The latest release ($version) is not a CLI release; set version to one such as 0.28.0."
            exit 2
          fi
          echo "::notice title=cartograph::version is latest, so release $version is used." \
            "Pin version and sha256 (and the action commit SHA) for reproducible runs."
        elif ! [[ "$version" =~ $release_pattern ]]; then
          echo "::error::version must be latest or a CLI release tag such as 0.28.0."
          exit 64
        fi
        archive="cartograph-${version}-macos-universal.tar.gz"
        # GitHub records each asset's SHA-256 at upload; a download that differs is not that asset.
        if ! digest="$(gh api "repos/ictechgy/cartograph/releases/tags/$version" \
          --jq ".assets[] | select(.name == \"$archive\") | .digest")"; then
          echo "::error::Could not read release $version of ictechgy/cartograph; check that this version exists."
          exit 2
        fi
        if ! [[ "$digest" =~ $digest_pattern ]]; then
          echo "::error::Release $version has no SHA-256 digest for $archive; check its assets or pin another version."
          exit 2
        fi
        directory="$(mktemp -d "${RUNNER_TEMP:-/tmp}/cartograph-action.XXXXXX")"
        gh release download "$version" --repo ictechgy/cartograph \
          --pattern "$archive" --dir "$directory" --clobber
        actual="$(shasum -a 256 < "$directory/$archive")"
        actual="${actual%% *}"
        if [ "$actual" != "${digest#sha256:}" ]; then
          echo "::error::$archive does not match the SHA-256 that GitHub recorded for release $version;" \
            "it was not extracted. Retry, and report the release if this persists."
          exit 2
        fi
        if [ -n "$INPUT_SHA256" ] && [ "$actual" != "$INPUT_SHA256" ]; then
          echo "::error::$archive does not match the sha256 input; set sha256 to the digest of release $version."
          exit 2
        fi
        # Extract only the executable, so no other member or link from the archive is written.
        binary="$directory/cartograph/cartograph"
        if ! tar -xzf "$directory/$archive" -C "$directory" cartograph/cartograph \
          || [ ! -f "$binary" ] || [ -L "$binary" ]; then
          echo "::error::$archive has no regular file cartograph/cartograph; check the release archive."
          exit 2
        fi
        chmod +x "$binary"
        echo "binary=$binary" >> "$GITHUB_OUTPUT"

    - name: Check the downloaded binary
      if: ${{ inputs.binary == '' }}
      shell: bash
      env:
        CARTOGRAPH_BINARY: ${{ steps.resolve.outputs.binary }}
      run: |
        # The first run of the downloaded binary happens here, in a step without the GitHub token.
        "$CARTOGRAPH_BINARY" --version

    - name: Build the index
      if: ${{ inputs.build == 'swift' }}
      shell: bash
      working-directory: ${{ inputs.project }}
      run: swift build

    - name: Run the gate
      id: run
      shell: bash
      env:
        CARTOGRAPH_BINARY: ${{ steps.resolve.outputs.binary }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_SARIF: ${{ inputs.sarif-file }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        case "$INPUT_COMMAND" in
          check|dead|cycles|rules) ;;
          *)
            echo "::error::unsupported command: $INPUT_COMMAND (expected check, dead, cycles or rules)"
            exit 2
            ;;
        esac
        strict=()
        if [ "$INPUT_FAIL_ON_FINDINGS" = "true" ]; then strict=(--strict); fi
        mkdir -p "$(dirname "$INPUT_SARIF")"
        # A failed invocation must not upload a report left by an earlier run.
        rm -f -- "$INPUT_SARIF"
        # Findings are expected to exit 1; the final step decides whether that fails the job.
        set +e
        # Split args into words but never glob them, so --include/--exclude patterns reach the CLI as written.
        set -f
        # shellcheck disable=SC2086 — word splitting of the workflow-author controlled args is intended.
        "$CARTOGRAPH_BINARY" "$INPUT_COMMAND" --project "$INPUT_PROJECT" \
          "${strict[@]}" --report-format sarif --output "$INPUT_SARIF" --quiet $INPUT_ARGS
        code=$?
        set +f
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if { [ "$code" = "0" ] || [ "$code" = "1" ]; } && [ -s "$INPUT_SARIF" ]; then
          # CLI paths are project-relative; GitHub resolves paths from the checkout root.
          # -I: this runs inside the analyzed checkout, whose modules must not shadow the standard library.
          python3 -I - "$INPUT_SARIF" "$INPUT_PROJECT" <<'PY'
        import json, sys
        from pathlib import Path
        from urllib.parse import unquote, urlsplit
        report, project = Path(sys.argv[1]), Path(sys.argv[2]).resolve()
        document = json.loads(report.read_text())
        def visit(value):
            if isinstance(value, dict):
                location = value.get('artifactLocation')
                if isinstance(location, dict) and isinstance(location.get('uri'), str):
                    uri = location['uri']
                    if not urlsplit(uri).scheme and not location.get('uriBaseId'):
                        location['uri'] = (project / unquote(uri)).as_uri()
                for item in value.values():
                    visit(item)
            elif isinstance(value, list):
                for item in value:
                    visit(item)
        visit(document)
        report.write_text(json.dumps(document, indent=2, sort_keys=True) + '\n')
        PY
          echo "sarif-file=$INPUT_SARIF" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::no SARIF report was written (cartograph exit $code)"
        fi

    - name: Upload SARIF
      id: upload
      if: ${{ inputs.upload-sarif == 'true' && steps.run.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: cartograph

    - name: Report the result
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        SARIF: ${{ steps.run.outputs.sarif-file }}
      run: |
        case "$EXIT_CODE" in
          0|1) ;;
          *)
            echo "::error::cartograph could not analyze the project (exit $EXIT_CODE); see the log above."
            exit 2
            ;;
        esac
        if [ -z "$SARIF" ]; then
          echo "::error::cartograph produced no SARIF report; check command arguments and output permissions."
          exit 2
        fi
        if [ "$EXIT_CODE" = "1" ]; then
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then
            echo "::error::cartograph reported findings. Review the code scanning alerts or $SARIF."
            exit 1
          fi
          echo "cartograph reported findings; fail-on-findings is false, so the step passes."
        fi
